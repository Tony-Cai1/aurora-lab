# PR fixture for Aurora's incident-guided browser test.
# The two one-replica Deployments recreate the effective state of scenario 19
# while giving the test stable labels that survive pod replacement.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-retained
  namespace: shop
data:
  default.conf: |
    upstream api {
        server api:8080;
    }
    server {
        listen 80;
        location /healthz { return 200 "ok\n"; }
        location /api/ {
            proxy_pass http://api/;
            proxy_connect_timeout 2s;
        }
        location / { return 200 "shop frontend retained\n"; }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-restarted
  namespace: shop
data:
  default.conf: |
    upstream api {
        server api:8000;
    }
    server {
        listen 80;
        location /healthz { return 200 "ok\n"; }
        location /api/ {
            proxy_pass http://api/;
            proxy_connect_timeout 2s;
        }
        location / { return 200 "shop frontend restarted\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-retained
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      aurora.dev/replica: retained
  template:
    metadata:
      labels:
        app: frontend
        aurora.dev/replica: retained
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /healthz, port: 80}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts: [{name: conf, mountPath: /etc/nginx/conf.d}]
      volumes:
        - name: conf
          configMap: {name: frontend-nginx-retained}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-restarted
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      aurora.dev/replica: restarted
  template:
    metadata:
      labels:
        app: frontend
        aurora.dev/replica: restarted
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /healthz, port: 80}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts: [{name: conf, mountPath: /etc/nginx/conf.d}]
      volumes:
        - name: conf
          configMap: {name: frontend-nginx-restarted}
